# RAG (Retrieval-Augmented Generation) 

# Chroma 
chroma:
  # 
  persist_directory: "data/chroma/social_debate"
  collection_name: "social_debate_collection"
  
  # 
  embedding:
    model: "text-embedding-3-small"
    dimension: 1536
    batch_size: 500
  
  # 
  retrieval:
    top_k: 8
    score_threshold: 0.0
    include_metadata: true

# 
simple_retriever:
  index_path: "src/rag/data/rag/simple_index.json"
  top_k: 3
  use_fuzzy_match: true

# 
evidence_selection:
  # 
  weights:
    relevance: 0.4
    quality: 0.3
    similarity: 0.3
  
  # 
  type_preference:
    - "research"
    - "expert_opinion"
    - "case_study"
    - "statistics"
    - "anecdotal"

# 
indexing:
  # 
  data_source: "data/raw/pairs.jsonl"
  
  # 
  chunk_size: 1000
  chunk_overlap: 200
  min_chunk_length: 100
  
  # 
  extract_metadata: true
  metadata_fields:
    - "submission_id"
    - "score"
    - "author"
    - "created_utc"
    - "delta_awarded"
  
  # 
  quality_filter:
    min_score: 10
    min_length: 50
    max_length: 5000

# 
cache:
  enabled: true
  ttl: 3600  # 
  max_size: 1000

# 
hybrid_retrieval:
  # 
  enabled: true
  
  # 
  weights:
    vector_search: 0.7    # 
    bm25: 0.3            # BM25 
  
  # BM25 
  bm25_params:
    k1: 1.2
    b: 0.75

# 
reranking:
  # 
  enabled: true
  
  # 
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  
  # 
  top_k_rerank: 20      #  K 
  final_top_k: 5        # 

# 
advanced_features:
  # 
  context_aware:
    enabled: true
    context_window: 3   #  N 
    
  # 
  personalization:
    enabled: false
    user_profile_weight: 0.2
    
  # 
  multilingual:
    enabled: false
    languages: ["en", "zh", "es"]

# 
optimization:
  # 
  batch_processing:
    enabled: true
    batch_size: 32
    
  # GPU 
  gpu_acceleration:
    enabled: true
    device: "cuda:0"
    
  # 
  index_optimization:
    type: "IVF"         # IVF, HNSW, LSH
    nlist: 100          # IVF 
    nprobe: 10          # 
