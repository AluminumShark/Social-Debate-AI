# 
debate:
  # 
  max_rounds: 5
  
  #  Agent
  agents:
    - Agent_A
    - Agent_B
    - Agent_C
  
  # 
  default_topic: ""
  
  # Agent 
  agent_configs:
    Agent_A:
      initial_stance: 0.8    # 
      initial_conviction: 0.7
      personality: "analytical"
      strategy_preference:   # 
        analytical: 0.4
        empathetic: 0.3
        defensive: 0.2
        aggressive: 0.1
    Agent_B:
      initial_stance: -0.6   # 
      initial_conviction: 0.6
      personality: "aggressive"
      strategy_preference:
        aggressive: 0.4
        defensive: 0.3
        analytical: 0.2
        empathetic: 0.1
    Agent_C:
      initial_stance: 0.0    # 
      initial_conviction: 0.5
      personality: "empathetic"
      strategy_preference:
        empathetic: 0.4
        analytical: 0.3
        defensive: 0.2
        aggressive: 0.1
  
  # 
  victory_conditions:
    surrender_threshold: 0.4      # 
    stance_neutral_threshold: 0.2 # 
    consecutive_persuasion: 3     # 
    
  # 
  persuasion_factors:
    base_persuasion: 0.3         # 
    strategy_bonus: 0.2          # 
    evidence_bonus: 0.3          # 
    social_influence: 0.2        # 

# GPT 
gpt:
  model: "gpt-3.5-turbo"
  temperature: 0.7
  max_tokens: 500
  system_prompt: |
    
    
    

# 
parallel:
  max_workers: 4
  timeout: 30  # 
  
  # 
  module_priorities:
    rl: 1      # 
    gnn: 2
    rag: 3

# 
strategy_fusion:
  # 
  method: "weighted_average"  # weighted_average, voting, adaptive
  
  # 
  weights:
    rl_policy: 0.4      # RL 
    gnn_suggestion: 0.3 # GNN 
    personality: 0.3    # 
  
  # 
  adaptive:
    enabled: true
    learning_rate: 0.1

# 
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # 
  module_logging:
    rl: "DEBUG"
    gnn: "INFO"
    rag: "INFO"
    orchestrator: "DEBUG"