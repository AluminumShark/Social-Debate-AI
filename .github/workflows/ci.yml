name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev || pip install -e ".[dev]"

      - name: Lint (ruff)
        run: uv run ruff check . || ruff check .

      - name: Run tests
        # LLM-dependent integration tests are skipped in CI (no backend).
        env:
          USE_LLM_JUDGE: "false"
        run: uv run pytest -q tests/unit || pytest -q tests/unit
