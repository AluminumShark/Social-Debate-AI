# Social Debate AI 
#
# API Key 
# =================
# 1. 
#    api.openai.api_key: "your-api-key-here"
#
# 2. 
#     OPENAI_API_KEY=your-api-key
#     api.openai.api_key_env 
#
# 3. 
#    api.openai.api_key_file: "path/to/your/api-key.txt"
#
#  API key
#

# 
version: "2.0.0"

# 
mode: "production"  # development, production, debug

# 
modules:
  rl:
    enabled: true
    type: "ppo"  # ppo, dqn, a2c
    config_file: "configs/rl.yaml"
    
  gnn:
    enabled: true
    type: "supervised"  # supervised, unsupervised
    config_file: "configs/gnn.yaml"
    
  rag:
    enabled: true
    type: "hybrid"  # simple, chroma, hybrid
    config_file: "configs/rag.yaml"

# 
resources:
  # GPU 
  gpu:
    enabled: true
    device: "cuda:0"
    memory_fraction: 0.8
    
  # CPU 
  cpu:
    max_threads: 8
    affinity: null
    
  # 
  memory:
    max_usage_gb: 16
    cache_size_gb: 2

# API 
api:
  # OpenAI API
  openai:
    # API Key 
    api_key: ""  #  API key
    api_key_env: "OPENAI_API_KEY"  # 
    api_key_file: ""  #  API key
    
    # 
    max_retries: 3
    timeout: 30
    base_url: "https://api.openai.com/v1"  # API  URL
    
    # 
    default_model: "gpt-3.5-turbo"
    max_tokens: 2048
    temperature: 0.7
    
  #  API
  huggingface:
    enabled: false
    api_key: ""
    api_key_env: "HF_API_KEY"
    api_key_file: ""

# 
paths:
  # 
  data_dir: "data"
  raw_data: "data/raw"
  processed_data: "data/processed"
  
  # 
  models_dir: "data/models"
  checkpoints_dir: "data/checkpoints"
  
  # 
  logs_dir: "logs"
  
  # 
  cache_dir: "cache"

# 
monitoring:
  # 
  system_metrics:
    enabled: true
    interval: 60  # 
    
  # 
  model_metrics:
    enabled: true
    track_latency: true
    track_accuracy: true
    
  # 
  alerts:
    enabled: false
    email: null
    slack_webhook: null

# 
security:
  # API 
  api_security:
    rate_limiting: true
    max_requests_per_minute: 60
    
  # 
  data_security:
    encryption: false
    anonymization: true
    
  # 
  model_security:
    adversarial_detection: false
    output_filtering: true

# 
experiment_tracking:
  # 
  tool: "tensorboard"  # tensorboard, mlflow, wandb, none
  
  # 
  track_hyperparameters: true
  track_metrics: true
  track_artifacts: true
  
  # 
  experiment_name_format: "{module}_{timestamp}"

# 
deployment:
  # 
  server:
    host: "0.0.0.0"
    port: 5000
    workers: 4
    
  # 
  load_balancing:
    enabled: false
    strategy: "round_robin"
    
  # 
  auto_scaling:
    enabled: false
    min_instances: 1
    max_instances: 10

# 
backup:
  # 
  auto_backup:
    enabled: true
    frequency: "daily"  # hourly, daily, weekly
    retention_days: 30
    
  # 
  backup_items:
    - models
    - configs
    - logs
    
  # 
  backup_location: "backups/"

# 
development:
  # 
  debug: false
  
  # 
  hot_reload: true
  
  # 
  testing:
    unit_tests: true
    integration_tests: true
    coverage_threshold: 80 