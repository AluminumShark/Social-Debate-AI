# RL (Reinforcement Learning) 

# PPO 
ppo:
  # 
  episodes: 1000          # 
  max_steps: 50           # 
  batch_size: 64          # 
  
  # PPO 
  learning_rate: 3e-4     # 
  gamma: 0.99             # 
  clip_epsilon: 0.2       # PPO 
  value_loss_coef: 0.5    # 
  entropy_coef: 0.01      # 
  
  # 
  update_epochs: 4        #  epoch 
  gae_lambda: 0.95        # GAE lambda

# Actor-Critic 
policy_network:
  # 
  state_dim: 901          # 768 (BERT) + 1 () + 1 () + 1 () + 128 () + 2 ()
  hidden_size: 256
  
  # 
  num_strategies: 4
  strategies:
    - name: "aggressive"
      id: 0
      description: " - "
    - name: "defensive"
      id: 1
      description: " - "
    - name: "analytical"
      id: 2
      description: " - "
    - name: "empathetic"
      id: 3
      description: " - "
  
  # Dropout
  dropout: 0.1

# 
environment:
  # 
  reward_scale: 1.0           # 
  persuasion_bonus: 5         # 
  surrender_penalty: -3       # 
  diversity_bonus: 0.1        # 
  
  # 
  max_rounds: 10              # 
  conviction_threshold: 0.3   # 
  stance_threshold: 0.2       # 
  
  # 
  stance_momentum: 0.8        # 
  conviction_decay: 0.05      # 

# 
training:
  # 
  save_frequency: 100         #  N  episode 
  log_frequency: 10           #  N  episode 
  evaluation_episodes: 50     #  episode 
  
  # GPU 
  device: "auto"  # auto, cuda, cpu
  
  # 
  optimizer:
    type: "adam"
    eps: 1e-5
  
  # 
  gradient_clipping: 0.5
  
  # 
  seed: 42

# 
experience_replay:
  # 
  buffer_size: 10000
  
  # 
  sample_size: 64
  
  # 
  prioritized:
    enabled: false
    alpha: 0.6
    beta: 0.4

# 
evaluation:
  # 
  metrics:
    - "average_reward"      # 
    - "win_rate"           # 
    - "persuasion_rate"    # 
    - "strategy_diversity" # 
    - "episode_length"     # 
  
  # 
  eval_frequency: 100      #  N  episode 
  
  # 
  generate_report: true
  report_format: ["json", "png"]

# 
inference:
  # 
  exploration:
    enabled: true
    method: "epsilon_greedy"  # epsilon_greedy, boltzmann
    epsilon: 0.1
    temperature: 1.0
    decay_rate: 0.995
    min_epsilon: 0.01
  
  # 
  strategy_selection:
    # 
    consider_history: true    # 
    consider_opponent: true   # 
    consider_context: true    # 

# 
checkpointing:
  save_dir: "data/models/ppo"
  save_best_only: false      # PPO 
  save_frequency: 100        #  N  episode
  keep_last_n: 5            #  N 
  
  # 
  save_items:
    - "actor_model"
    - "critic_model"
    - "optimizer_state"
    - "training_stats"

# 
logging:
  level: "INFO"
  log_dir: "logs/ppo"
  tensorboard: true
  wandb: false              #  Weights & Biases
