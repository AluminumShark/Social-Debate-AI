<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Debate AI - </title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern-style.css') }}">
</head>
<body>
    <!--  -->
    <div class="animated-bg">
        <div class="gradient-bg"></div>
        <div class="particle-bg"></div>
    </div>

    <!--  -->
    <div class="main-container">
        <!--  -->
        <nav class="top-nav">
            <div class="nav-container">
                <div class="brand">
                    <i class="fas fa-brain brand-icon"></i>
                    <span class="brand-text">Social Debate AI</span>
                </div>
                <div class="nav-actions">
                    <span class="badge bg-secondary" id="llmBadge" title="Active LLM backend">llm</span>
                    <button class="nav-btn" onclick="showAbout()">
                        <i class="fas fa-info-circle"></i>
                        <span></span>
                    </button>
                    <button class="nav-btn" onclick="toggleTheme()">
                        <i class="fas fa-moon" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </nav>

        <!--  -->
        <div class="content-wrapper">
            <div class="container-fluid">
                <div class="row">
                    <!--  -->
                    <div class="col-lg-4 col-xl-3">
                        <!--  -->
                        <div class="control-panel" data-aos="fade-right">
                            <h3 class="panel-title">
                                <i class="fas fa-cog"></i> 
                            </h3>
                            
                            <!--  -->
                            <div class="control-section">
                                <label class="control-label"></label>
                                <div class="input-group modern-input">
                                    <input type="text" 
                                           id="topicInput" 
                                           class="form-control" 
                                           placeholder="..."
                                           value="">
                                    <button class="btn btn-primary" onclick="setTopic()">
                                        <i class="fas fa-arrow-right"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Rounds -->
                            <div class="control-section">
                                <label class="control-label">Rounds</label>
                                <input type="number" id="roundsInput" class="form-control form-control-sm"
                                       min="1" max="10" value="3">
                            </div>

                            <!--  -->
                            <div class="control-actions">
                                <button class="action-btn primary" onclick="startDebate()" id="startBtn">
                                    <i class="fas fa-play"></i>
                                    <span>Start (streaming)</span>
                                </button>
                                <button class="action-btn secondary" onclick="runDemo()" id="demoBtn">
                                    <i class="fas fa-wand-magic-sparkles"></i>
                                    <span>Try demo (no key)</span>
                                </button>
                                <button class="action-btn danger" onclick="resetDebate()">
                                    <i class="fas fa-redo"></i>
                                    <span>Reset</span>
                                </button>
                            </div>

                            <!-- BYOK: bring your own LLM key (stored in browser only) -->
                            <div class="control-section">
                                <details>
                                    <summary class="control-label" style="cursor:pointer">
                                        <i class="fas fa-key"></i> LLM settings (optional — use your own key)
                                    </summary>
                                    <div class="mt-2">
                                        <input class="form-control form-control-sm mb-1" id="byokProvider" placeholder="provider (openai / ollama)">
                                        <input class="form-control form-control-sm mb-1" id="byokModel" placeholder="model (e.g. gpt-5.5)">
                                        <input class="form-control form-control-sm mb-1" id="byokBaseUrl" placeholder="base_url (e.g. https://api.openai.com/v1)">
                                        <input class="form-control form-control-sm mb-1" id="byokApiKey" type="password" placeholder="api key (kept in your browser only)">
                                        <div class="d-flex gap-2">
                                            <button class="btn btn-sm btn-primary" onclick="saveByok()">Save</button>
                                            <button class="btn btn-sm btn-outline-secondary" onclick="clearByok()">Clear</button>
                                        </div>
                                        <small class="text-muted d-block mt-1">
                                            Your key never leaves your browser except to call the model for your own debates. It is not stored on the server.
                                        </small>
                                    </div>
                                </details>
                            </div>
                            
                            <!--  -->
                            <div class="status-display">
                                <div class="status-item">
                                    <span class="status-label"></span>
                                    <span class="status-value" id="currentRound">0</span>
                                </div>
                                <div class="status-item">
                                    <span class="status-label"></span>
                                    <span class="status-value" id="debateStatus"></span>
                                </div>
                            </div>
                        </div>

                        <!-- AI  -->
                        <div class="agents-panel" data-aos="fade-right" data-aos-delay="100">
                            <h3 class="panel-title">
                                <i class="fas fa-users"></i> AI 
                            </h3>
                            
                            <!-- Agent A -->
                            <div class="agent-card" id="agentA">
                                <div class="agent-header">
                                    <div class="agent-avatar support">
                                        <i class="fas fa-user-tie"></i>
                                    </div>
                                    <div class="agent-info">
                                        <h5> A</h5>
                                        <p></p>
                                    </div>
                                </div>
                                <div class="agent-stats">
                                    <div class="stat-bar">
                                        <label></label>
                                        <div class="progress">
                                            <div class="progress-bar bg-success" id="stanceA" style="width: 80%">
                                                <span>+0.8</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="stat-bar">
                                        <label></label>
                                        <div class="progress">
                                            <div class="progress-bar bg-info" id="convictionA" style="width: 70%">
                                                <span>0.7</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Agent B -->
                            <div class="agent-card" id="agentB">
                                <div class="agent-header">
                                    <div class="agent-avatar oppose">
                                        <i class="fas fa-user-shield"></i>
                                    </div>
                                    <div class="agent-info">
                                        <h5> B</h5>
                                        <p></p>
                                    </div>
                                </div>
                                <div class="agent-stats">
                                    <div class="stat-bar">
                                        <label></label>
                                        <div class="progress">
                                            <div class="progress-bar bg-danger" id="stanceB" style="width: 30%">
                                                <span>-0.6</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="stat-bar">
                                        <label></label>
                                        <div class="progress">
                                            <div class="progress-bar bg-info" id="convictionB" style="width: 60%">
                                                <span>0.6</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Agent C -->
                            <div class="agent-card" id="agentC">
                                <div class="agent-header">
                                    <div class="agent-avatar neutral">
                                        <i class="fas fa-user-graduate"></i>
                                    </div>
                                    <div class="agent-info">
                                        <h5> C</h5>
                                        <p></p>
                                    </div>
                                </div>
                                <div class="agent-stats">
                                    <div class="stat-bar">
                                        <label></label>
                                        <div class="progress">
                                            <div class="progress-bar bg-warning" id="stanceC" style="width: 50%">
                                                <span>0.0</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="stat-bar">
                                        <label></label>
                                        <div class="progress">
                                            <div class="progress-bar bg-info" id="convictionC" style="width: 50%">
                                                <span>0.5</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!--  -->
                    <div class="col-lg-8 col-xl-9">
                        <div class="debate-area" data-aos="fade-left">
                            <!--  -->
                            <div class="debate-header">
                                <h2 class="debate-title">
                                    <i class="fas fa-comments"></i> 
                                </h2>
                                <div class="debate-topic" id="topicDisplay">
                                    
                                </div>
                            </div>

                            <!--  -->
                            <div class="debate-content" id="debateContent">
                                <!--  -->
                                <div class="welcome-screen">
                                    <div class="welcome-icon">
                                        <i class="fas fa-robot"></i>
                                    </div>
                                    <h3> Social Debate AI</h3>
                                    <p> AI </p>
                                    <div class="feature-list">
                                        <div class="feature-item">
                                            <i class="fas fa-brain"></i>
                                            <span></span>
                                        </div>
                                        <div class="feature-item">
                                            <i class="fas fa-chart-line"></i>
                                            <span></span>
                                        </div>
                                        <div class="feature-item">
                                            <i class="fas fa-sync"></i>
                                            <span></span>
                                        </div>
                                    </div>
                                    <p class="mt-4">"" AI </p>
                                </div>
                            </div>

                            <!--  -->
                            <div class="debate-controls">
                                <button class="control-btn" onclick="exportDebate()">
                                    <i class="fas fa-download"></i> 
                                </button>
                                <button class="control-btn" onclick="showStats()">
                                    <i class="fas fa-chart-bar"></i> 
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--  -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-content">
            <div class="loading-spinner">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            <p class="loading-text" id="loadingText">...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="{{ url_for('static', filename='js/modern-app.js') }}"></script>
    
    <script>
        //  AOS 
        AOS.init({
            duration: 800,
            once: true
        });
    </script>
</body>
</html>
