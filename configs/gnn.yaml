# GNN (Graph Neural Network) 

# 
model:
  # 
  architecture: "PersuasionGNN"
  
  # 
  input_dim: 770         # BERT (768) +  (2)
  hidden_dim: 256       # 
  output_dim: 128       # 
  
  # 
  num_layers: 3
  
  # 
  dropout: 0.2
  
  # 
  activation: "relu"
  
  # 
  conv_type: "GraphSAGE"  #  GraphSAGE
  
  # 
  attention:
    enabled: true
    heads: 4
    concat: false

# 
training:
  # 
  epochs: 50
  learning_rate: 0.001
  batch_size: 32
  
  # 
  optimizer: "adam"
  weight_decay: 0.0001
  
  # 
  scheduler:
    type: "step"
    step_size: 10
    gamma: 0.5
  
  # 
  early_stopping:
    patience: 10
    min_delta: 0.001
    
  # 
  task_weights:
    delta_prediction: 0.5    # Delta 
    quality_regression: 0.3  # 
    strategy_classification: 0.2  # 

# 
persuasion_prediction:
  # 
  strategies:
    - aggressive    # 
    - defensive     # 
    - analytical    # 
    - empathetic    # 
  
  # 
  argument_features:
    causal_markers: ["because", "therefore", "thus", "hence", "consequently"]
    contrast_markers: ["however", "but", "although", "despite", "nevertheless"]
    evidence_markers: ["studies show", "research indicates", "data suggests", "according to"]
    example_markers: ["for example", "for instance", "such as", "like"]
    emphasis_markers: ["indeed", "in fact", "clearly", "obviously", "certainly"]

# 
social_influence:
  # 
  method: "model_based"  # 
  
  # 
  weights:
    delta_probability: 0.7
    quality_score: 0.3

# 
checkpointing:
  save_dir: "data/models"
  model_name: "gnn_persuasion.pt"
  save_best_only: true
  monitor_metric: "delta_accuracy"

# 
evaluation:
  # 
  metrics:
    - delta_accuracy
    - delta_f1_score
    - strategy_accuracy
    - quality_mse
  
  # 
  test_split: 0.2
  
  # 
  random_seed: 42

# 
logging:
  level: "INFO"
  log_dir: "logs/gnn"
  tensorboard: false
