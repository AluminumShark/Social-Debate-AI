[project]
name = "social-debate-ai"
version = "0.1.0"
description = "AI-powered debate simulation system with LangGraph orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Deep Learning
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    # LangChain & LangGraph
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # Vector Database
    "faiss-cpu>=1.7.0",
    # API & Web
    "openai>=1.0.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "python-dotenv>=1.0.0",
    # Configuration
    "pyyaml>=6.0",
    # Utilities
    "tqdm>=4.65.0",
    "networkx>=3.0",
    "tiktoken>=0.5.0",
    "aiohttp>=3.8.0",
    "langchain-community>=0.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=7.3.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
